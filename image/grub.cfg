set default=0
set timeout=5
insmod all_video
set gfxpayload=1024x768,auto

# RAM-only boot with kernel memory zeroing and hardening.
set common="boot=live toram nomodeset consoleblank=0 quiet loglevel=3 systemd.show_status=false init_on_free=1 init_on_alloc=1 slab_nomerge page_alloc.shuffle=1 randomize_kstack_offset=on vsyscall=none debugfs=off lockdown=confidentiality"
# Internal-disk and DMA-bus drivers the kernel refuses to load in signing mode.
set block="module_blacklist=ahci,nvme,nvme_core,mmc_block,sdhci_pci,virtio_blk,ata_piix,pata_acpi,ata_generic,firewire_ohci,thunderbolt"

menuentry "airsign offline signer" {
  linux /live/vmlinuz $common $block
  initrd /live/initrd.img
}

menuentry "airsign self-test (serial console, powers off when done)" {
  linux /live/vmlinuz $common $block airsign.selftest=1 console=tty0 console=ttyS0,115200
  initrd /live/initrd.img
}

menuentry "ERASE this computer's internal drives (asks before each drive)" {
  linux /live/vmlinuz $common airsign.wipe=1
  initrd /live/initrd.img
}
