# Belt and braces next to the kernel's module_blacklist= on the boot line and
# the deleted driver trees: never load radio, network or DMA-capable bus drivers.
install bluetooth /bin/false
install btusb /bin/false
install cfg80211 /bin/false
install mac80211 /bin/false
install thunderbolt /bin/false
install firewire_ohci /bin/false
install cdc_ether /bin/false
install rndis_host /bin/false
