# Only keyboards/mice, hubs, and cameras (video class, with the microphone
# interface most webcams carry). Every interface of a device must be on the list,
# so a "keyboard" that also exposes mass storage or a network adapter is blocked.
# Storage, network, serial, Bluetooth, smart cards and vendor-specific devices,
# including the USB stick this system booted from, are refused once it is in RAM.
allow with-interface match-all { 03:*:* 09:*:* }
allow with-interface match-all { 0e:*:* 01:*:* }
